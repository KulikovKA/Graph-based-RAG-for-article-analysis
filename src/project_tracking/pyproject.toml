[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-rag-project-tracking"
version = "1.0.0"
requires-python = ">=3.11"
description = "Клиент агрегированных метрик Graph-RAG для общего MLflow"

[tool.setuptools]
packages = ["project_tracking"]
package-dir = {project_tracking = "."}
