name: article-analysis

x-api-limits: &api-limits
  mem_limit: 1536m
  mem_reservation: 512m

services:
  api:
    build: { context: ., dockerfile: docker/Dockerfile.api }
    image: article-analysis-api:local
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_HTTP_DEV_ENABLED: ${APP_HTTP_DEV_ENABLED:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-article_app}:${POSTGRES_PASSWORD:-local-dev-only-change-me}@postgres:5432/${POSTGRES_DB:-article_analysis}
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-dev-only-change-me}@redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local-dev-only-change-me}
      QDRANT_URL: http://qdrant:6333
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [backend, egress]
    <<: *api-limits

  worker:
    image: article-analysis-api:local
    init: true
    restart: unless-stopped
    command: ["python", "-m", "app.workers.bootstrap"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER:-article_app}:${POSTGRES_PASSWORD:-local-dev-only-change-me}@postgres:5432/${POSTGRES_DB:-article_analysis}
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-dev-only-change-me}@redis:6379/0
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      api: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/tmp/worker.ready').is_file()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs: [/tmp]
    networks: [backend, egress]
    <<: *api-limits

  migrate:
    image: article-analysis-api:local
    command: ["python", "-m", "app.storage.migrate_stub"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-article_app}:${POSTGRES_PASSWORD:-local-dev-only-change-me}@postgres:5432/${POSTGRES_DB:-article_analysis}
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-article_analysis}
      POSTGRES_USER: ${POSTGRES_USER:-article_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]
    mem_limit: 2g
    mem_reservation: 512m

  redis:
    image: redis:7.4.11-bookworm
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-dev-only-change-me}
    command: [redis-server, --appendonly, "yes", --maxmemory, 256mb, --maxmemory-policy, allkeys-lru, --requirepass, "${REDIS_PASSWORD:-local-dev-only-change-me}"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]
    mem_limit: 512m
    mem_reservation: 128m

  neo4j:
    image: neo4j:2026.08.1-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-local-dev-only-change-me}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 1G
    volumes: [neo4j_data:/data, neo4j_logs:/logs]
    healthcheck:
      test: ["CMD-SHELL", "PASSWORD=$${NEO4J_AUTH#neo4j/}; cypher-shell --non-interactive -u neo4j -p \"$$PASSWORD\" 'RETURN 1' >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks: [backend]
    mem_limit: 4g
    mem_reservation: 2g

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD", "bash", "-c", ": >/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [backend]
    mem_limit: 3g
    mem_reservation: 1g

  inference:
    image: ollama/ollama:0.34.1
    profiles: [cpu]
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes: [model_weights:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [backend]
    mem_limit: 12g
    mem_reservation: 6g

  caddy-dev:
    image: article-analysis-web:local
    build: { context: ., dockerfile: docker/Dockerfile.web }
    profiles: [dev]
    restart: unless-stopped
    ports: ["127.0.0.1:${DEV_HTTP_PORT:-8080}:80"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health/live"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [backend, egress]
    mem_limit: 256m
    mem_reservation: 64m

  caddy-prod:
    image: article-analysis-web:local
    build: { context: ., dockerfile: docker/Dockerfile.web }
    profiles: [prod]
    restart: unless-stopped
    environment: { PUBLIC_DOMAIN: "${PUBLIC_DOMAIN:-localhost}" }
    ports:
      - "${CADDY_BIND_ADDRESS:-127.0.0.1}:${PROD_HTTP_PORT:-8081}:80"
      - "${CADDY_BIND_ADDRESS:-127.0.0.1}:${PROD_HTTPS_PORT:-8443}:443"
    volumes: [./docker/Caddyfile.prod:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --quiet --tries=1 --spider --header=\"Host: $$PUBLIC_DOMAIN\" https://127.0.0.1/health/live"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [backend, egress]
    mem_limit: 256m
    mem_reservation: 64m

networks:
  backend: { internal: true }
  egress: { driver: bridge }

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  model_weights:
  caddy_data:
  caddy_config:
