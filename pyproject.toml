[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "article-analysis-rag"
version = "0.1.0"
description = "Graph-based retrieval augmented article analysis"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "neo4j==6.3.0",
  "pydantic==2.11.3",
  "psycopg[binary]==3.3.6",
  "SQLAlchemy==2.0.54",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "PyYAML==6.0.3",
  "pytest==8.3.5",
  "ruff==0.11.5",
  "types-psutil==7.2.2.20260906",
  "types-PyYAML==6.0.12.20260906",
]
inference = [
  "huggingface-hub==1.28.0",
  "psutil==7.2.2",
  "PyYAML==6.0.3",
  "torch==2.11.0",
  "transformers==5.1.0",
]
lightrag = [
  "lightrag-hku @ git+https://github.com/HKUDS/LightRAG.git@453dce83d6d0354a06e46c8d4029a0895c4e054b",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = ["data", "frontend", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
